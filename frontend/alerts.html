<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Alerts · DisNotify</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232ee6a8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">
  <main class="main">
    <div class="page-head">
      <div><h1>Price alerts</h1>
        <div class="sub">Rules that decide when DisNotify pings you.</div></div>
      <button class="btn btn-primary" id="newAlertBtn">New alert</button>
    </div>
    <div class="stat-grid" id="statRow"></div>
    <section class="card"><div class="card-head"><h2>Your rules</h2>
      <span class="small muted" id="ruleCount"></span></div>
      <div id="ruleList"></div></section>
    <section class="card mt-3"><div class="card-head"><h2>Recent triggers</h2>
      <button class="btn btn-sm btn-ghost" id="markRead">Mark all read</button></div>
      <div id="feed"></div></section>
  </main>
</div>
<script type="module" src="js/alerts.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Sign in · DisNotify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232ee6a8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<main class="center" style="min-height:100dvh;padding:20px;position:relative;z-index:1">
  <div class="card" style="width:100%;max-width:420px">
    <div class="card-body">
      <div class="row mb-3" style="gap:10px">
        <div class="brand-logo">D</div>
        <div class="brand-name">Dis<span>Notify</span></div>
      </div>
      <h1 id="formTitle">Welcome back</h1>
      <p class="small muted mt-1" id="formSub">Sign in to sync your watchlist and alerts across devices.</p>

      <form id="authForm" class="mt-3" novalidate>
        <div class="field hidden" id="nameField">
          <label for="name">Name</label>
          <input class="input" id="name" autocomplete="name" placeholder="Your name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="8">
          <div class="hint">Minimum 8 characters.</div>
        </div>
        <div id="formError" class="small text-bad mb-2 hidden"></div>
        <button class="btn btn-primary btn-block btn-lg" id="submitBtn" type="submit">Sign in</button>
      </form>

      <div class="divider"></div>
      <div class="center small muted">
        <span id="switchText">New here?</span>&nbsp;
        <a href="#" id="switchMode" class="bold" style="color:var(--accent)">Create an account</a>
      </div>
      <div class="center small mt-2">
        <a href="index.html" class="muted">Continue without an account &rarr;</a>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/auth.js"></script>
</body>
</html>
